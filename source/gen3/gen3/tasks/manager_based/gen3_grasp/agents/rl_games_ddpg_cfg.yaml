params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_observations: 100.0
    clip_actions: 100.0

  algo:
    name: ddpg

  model:
    name: ddpg

  network:
    name: ddpg
    mlp:
      units: [256, 256]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: grasp_gen3_ddpg
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.98
    tau: 0.005
    learning_rate: 1e-4
    lr_schedule: linear
    kl_threshold: 0
    score_to_win: 100000000
    max_epochs: 3000
    save_best_after: 50
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    minibatch_size: 2048
    mini_epochs: 1
    critic_coef: 1.0
    clip_value: False
    bounds_loss_coef: 0.0
    use_smooth_clamp: False
    # HER configuration
    her:
      enable: True
      strategy: future
      k: 4
      reward_func: ddpg